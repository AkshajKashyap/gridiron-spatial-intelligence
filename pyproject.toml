[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridiron-spatial-intelligence"
version = "0.1.0"
description = "Reproducible target–defender separation analysis using NFL player-tracking data"
readme = "README.md"
authors = [
    { name = "Akshaj Kashyap" },
]
license = { file = "LICENSE" }
keywords = [
    "NFL tracking",
    "spatiotemporal analysis",
    "sports analytics",
    "separation dynamics",
    "reproducible research",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas>=2.0",
    "pyarrow",
    "scikit-learn",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/AkshajKashyap/gridiron-spatial-intelligence"
Documentation = "https://github.com/AkshajKashyap/gridiron-spatial-intelligence#readme"
Changelog = "https://github.com/AkshajKashyap/gridiron-spatial-intelligence/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
