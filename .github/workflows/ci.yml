name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install build

      - name: Verify package import and version
        run: |
          python - <<'PY'
          import gridiron_spatial
          from importlib.metadata import version

          assert gridiron_spatial.__name__ == "gridiron_spatial"
          assert version("gridiron-spatial-intelligence") == "0.1.0"
          PY

      - name: Run complete test suite
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Check installed requirements
        run: python -m pip check

      - name: Build source and wheel distributions
        run: python -m build

      - name: Run focused release tests
        run: |
          python -m pytest -q \
            tests/test_packaging.py \
            tests/test_release_evidence.py \
            tests/test_portfolio_demo.py \
            tests/test_release_verification.py

      - name: Verify deterministic release surface
        run: |
          python scripts/build_release_evidence_manifest.py \
            --output artifacts/release/v0.1.0/evidence_manifest.json
          python scripts/run_portfolio_demo.py --check
          python scripts/verify_release.py
          git diff --exit-code
          git diff --check
